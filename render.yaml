services:
  - type: web
    name: tutorial-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    initialDeployHook: npm run db:seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tutorial-platform-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: tutorial-platform-db
    plan: free
    region: singapore
    databaseName: tutorial_platform
    user: tutorial_platform
